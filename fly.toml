# fly.toml app configuration file generated for docling-serve-monitoreo-panama on 2026-01-31T19:51:27-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'docling-serve-monitoreo-panama'
primary_region = 'iad'

[build]
  image = 'ghcr.io/docling-project/docling-serve-cpu:latest'

[http_service]
  internal_port = 5001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
