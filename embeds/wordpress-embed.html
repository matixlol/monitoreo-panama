<div id="monitoreo-fichas-root"></div>
<script type="module">
  import { mount, buildHashRoute, slugify } from 'https://fichas.panama.datos.party/visualizaciones-panama.js';

  mount({ target: '#monitoreo-fichas-root', emptyHash: '#/' });

  window.abrirFichaCandidato = (name) => (window.location.hash = buildHashRoute('candidato', slugify(name)));
  window.abrirFichaAportante = (name) => (window.location.hash = buildHashRoute('aportante', slugify(name)));
  window.abrirFichaProveedor = (name) => (window.location.hash = buildHashRoute('proveedor', slugify(name)));
</script>
