<!--
  Basic WordPress embed for the fichas modals.

  Assumptions:
  - window.documentosIngresos already exists on the page.
  - window.documentosEgresos already exists on the page.
  - You want the modals to open via hash routes like:
      #/ficha/candidato/:id
      #/ficha/aportante/:id
      #/ficha/proveedor/:id

  Current hosted script URL:
  https://monitoreo-panama-fichas-demo.vercel.app/fichas-modales.js
-->

<div id="monitoreo-fichas-root"></div>

<script type="module">
  import { mount, buildHashRoute, slugify } from 'https://monitoreo-panama-fichas-demo.vercel.app/fichas-modales.js';

  /**
   * Mount the modal system using the datasets that WordPress already exposes
   * on window.documentosIngresos and window.documentosEgresos.
   */
  mount({
    target: '#monitoreo-fichas-root',
    showLauncher: false,
    emptyHash: '#/',
  });

  /**
   * Optional helper so other inline scripts or links can build routes.
   * Example:
   *   window.abrirFichaCandidato('José Gabriel Carrizo Jaen')
   */
  window.abrirFichaCandidato = (candidateName) => {
    window.location.hash = buildHashRoute('candidato', slugify(candidateName));
  };

  window.abrirFichaAportante = (donorName) => {
    window.location.hash = buildHashRoute('aportante', slugify(donorName));
  };

  window.abrirFichaProveedor = (providerName) => {
    window.location.hash = buildHashRoute('proveedor', slugify(providerName));
  };
</script>
